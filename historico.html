<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOE Escolar | Histórico</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand compact" href="painel.html" aria-label="Página inicial do BOE Escolar">
      <div class="brand-logo small" aria-hidden="true"><span class="logo-document"></span><span class="logo-alert"></span></div>
      <span>BOE Escolar</span>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="painel.html">Painel</a>
      <a href="nova-ocorrencia.html">Nova ocorrência</a>
      <a href="historico.html" class="active">Histórico</a>
      <button id="logoutBtn" class="btn btn-ghost" type="button">Sair</button>
    </nav>
  </header>

  <main class="container">
    <section class="section-card">
      <div class="section-title">
        <div>
          <h1>Histórico de Ocorrências</h1>
          <p>Consulte, filtre e acompanhe os registros salvos.</p>
        </div>
        <button id="clearRecordsBtn" class="btn btn-secondary" type="button">Limpar demonstração</button>
      </div>

      <div class="filter-bar">
        <label for="searchInput" class="sr-only">Pesquisar ocorrência</label>
        <input id="searchInput" type="search" placeholder="Pesquisar por aluno, turma, local ou tipo..." />
        <select id="statusFilter" aria-label="Filtrar por status">
          <option value="todos">Todos os status</option>
          <option value="Pendente">Pendente</option>
          <option value="Registrado">Registrado</option>
          <option value="Encaminhado">Encaminhado</option>
        </select>
      </div>

      <div id="historyList" class="records-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
