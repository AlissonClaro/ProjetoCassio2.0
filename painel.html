<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOE Escolar | Painel</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand compact" href="painel.html" aria-label="Página inicial do BOE Escolar">
      <div class="brand-logo small" aria-hidden="true"><span class="logo-document"></span><span class="logo-alert"></span></div>
      <span>BOE Escolar</span>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="painel.html" class="active">Painel</a>
      <a href="nova-ocorrencia.html">Nova ocorrência</a>
      <a href="historico.html">Histórico</a>
      <button id="logoutBtn" class="btn btn-ghost" type="button">Sair</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero-card">
      <div>
        <p class="eyebrow">Área do professor</p>
        <h1>Painel Principal</h1>
        <p>Registre, revise e acompanhe ocorrências escolares graves de forma organizada.</p>
      </div>
      <a class="btn btn-primary" href="nova-ocorrencia.html">Registrar ocorrência</a>
    </section>

    <section class="stats-grid" aria-label="Indicadores de ocorrências">
      <article class="stat-card danger"><strong id="statPendentes">0</strong><span>Pendentes</span></article>
      <article class="stat-card primary"><strong id="statRegistradas">0</strong><span>Registradas</span></article>
      <article class="stat-card success"><strong id="statEncaminhadas">0</strong><span>Encaminhadas</span></article>
    </section>

    <section class="section-card">
      <div class="section-title">
        <div>
          <h2>Histórico recente</h2>
          <p>Últimos registros cadastrados no sistema.</p>
        </div>
        <a href="historico.html">Ver todos</a>
      </div>
      <div id="recentList" class="records-list"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
